<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Tình Yêu Của Anh - 20/10</title>
    
    <!-- Tải Google Fonts: Great Vibes cho tiêu đề lãng mạn, Quicksand cho phần thân bài -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Nền ruby lãng mạn, tối màu hơn để làm nổi bật thư */
            background: linear-gradient(135deg, #4a041f 0%, #880e4f 50%, #ff9a9e 100%);
            height: 100vh;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .envelope-container {
            position: relative;
            width: 88vw;
            max-width: 450px;
            /* Dùng aspect-ratio thay cho chiều cao cứng để luôn giữ đúng tỷ lệ phong bì */
            aspect-ratio: 1.5; 
            cursor: pointer;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes envelopeGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 154, 158, 0.3)); }
            50% { filter: drop-shadow(0 0 25px rgba(255, 154, 158, 0.7)); }
        }

        .envelope-container:not(.open) {
            animation: envelopeGlow 3s infinite;
        }

        .envelope-container.open {
            transform: translateY(12vh); /* Đẩy phong bì xuống một chút tạo không gian cho chữ */
            pointer-events: none;
        }

        .envelope-back {
            position: absolute;
            inset: 0;
            background: #6a0b3a; 
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .flap-left {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, #b01053, #d81b60);
            clip-path: polygon(0 0, 51% 51%, 0 100%);
            border-radius: 8px 0 0 8px;
            z-index: 3;
        }

        .flap-right {
            position: absolute;
            inset: 0;
            background: linear-gradient(to left, #b01053, #d81b60);
            clip-path: polygon(100% 0, 49% 51%, 100% 100%);
            border-radius: 0 8px 8px 0;
            z-index: 3;
        }

        .flap-bottom {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, #9c0d48, #d81b60);
            clip-path: polygon(0 100%, 51% 49%, 100% 100%);
            border-radius: 0 0 8px 8px;
            z-index: 3;
        }

        .flap-top {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, #d81b60, #e91e63);
            clip-path: polygon(0 0, 51% 51%, 100% 0);
            border-radius: 8px 8px 0 0;
            transform-origin: top;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 4;
        }

        .envelope-container.open .flap-top {
            transform: rotateX(180deg);
            z-index: 0; 
        }

        /* THẺ CHÚC MỪNG BÊN TRONG */
        .letter {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            height: auto; /* Tự động thay đổi chiều cao để không bao giờ tràn chữ */
            min-height: calc(100% - 20px);
            background: white;
            border-radius: 6px;
            z-index: 2; /* Nằm bên trong thư ban đầu */
            padding: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .letter-content {
            border: 2px dashed #ffb6c1;
            background: radial-gradient(circle at center, #ffffff 0%, #fff5f7 100%);
            border-radius: 4px;
            padding: 1.5rem;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* ANIMATION RÚT THƯ THÔNG MINH */
        .envelope-container.open .letter {
            animation: pullOutFront 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        @keyframes pullOutFront {
            0% { transform: translateY(0) scale(1); z-index: 2; }
            45% { transform: translateY(-115%) scale(1); z-index: 2; } /* Rút hoàn toàn ra khỏi bao thư */
            50% { transform: translateY(-115%) scale(1); z-index: 20; } /* Đưa lớp layer lên trước cùng */
            100% { transform: translateY(-30%) scale(1.05); z-index: 20; } /* Đặt thư xuống trước bìa, phóng to một chút */
        }

        /* HỆ THỐNG KÍCH THƯỚC CHỮ TỰ ĐỘNG (RESPONSIVE CLAMP) */
        .title {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2rem, 8vw, 3rem);
            color: #c2185b;
            margin-bottom: 0.5rem;
            line-height: 1.2;
            text-shadow: 1px 1px 2px rgba(194, 24, 91, 0.1);
        }

        .body-text {
            font-size: clamp(0.9rem, 4vw, 1.15rem);
            color: #444;
            line-height: 1.6;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .signature {
            font-weight: 600;
            font-size: clamp(0.9rem, 4vw, 1.1rem);
            color: #d81b60;
        }

        .signature-name {
            font-size: clamp(1.8rem, 7vw, 2.5rem);
            font-family: 'Great Vibes', cursive;
            color: #c2185b;
            display: inline-block;
            margin-top: 5px;
        }

        .instruction {
            position: absolute;
            bottom: -40px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            animation: pulseText 2s infinite;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            transition: opacity 0.5s;
        }

        .envelope-container.open .instruction {
            opacity: 0;
            animation: none;
        }

        @keyframes pulseText {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Canvas cho hiệu ứng hạt/trái tim rơi -->
    <canvas id="particles"></canvas>

    <div class="wrapper">
        <div class="envelope-container" id="envelope" onclick="openEnvelope()">
            <!-- Lớp nền (mặt sau) -->
            <div class="envelope-back"></div>
            
            <!-- Thẻ chúc mừng (nằm giữa mặt sau và nắp trước) -->
            <div class="letter">
                <div class="letter-content">
                    <h1 class="title">Gửi Kim Ngà,</h1>
                    <p class="body-text">
                        Chúc em ngày 20/10 thật nhiều niềm vui, luôn xinh đẹp và hạnh phúc bên anh. Cảm ơn em đã đến và làm cho cuộc sống của anh thêm rực rỡ.
                    </p>
                    <p class="signature">Yêu em,<br><span class="signature-name">Thành Nhân</span> ❤️</p>
                </div>
            </div>

            <!-- Các nắp của bao thư -->
            <div class="flap-left"></div>
            <div class="flap-right"></div>
            <div class="flap-bottom"></div>
            <div class="flap-top"></div>

            <!-- Chữ hướng dẫn -->
            <div class="instruction">Chạm để mở thư 💌</div>
        </div>
    </div>

    <script>
        // --- 1. Hiệu ứng mở thư ---
        function openEnvelope() {
            const envelope = document.getElementById('envelope');
            envelope.classList.add('open');
        }

        // --- 2. Hệ thống hạt và trái tim lấp lánh (Canvas) ---
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');

        let width, height;
        const particlesArray = [];

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Hàm vẽ trái tim
        function drawHeart(ctx, x, y, size, color, opacity) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(size / 20, size / 20); // Chuẩn hóa kích thước
            ctx.globalAlpha = opacity;
            ctx.fillStyle = color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = color;
            ctx.beginPath();
            ctx.moveTo(0, 5);
            ctx.bezierCurveTo(0, -5, -10, -5, -10, 5);
            ctx.bezierCurveTo(-10, 15, 0, 20, 0, 25);
            ctx.bezierCurveTo(0, 20, 10, 15, 10, 5);
            ctx.bezierCurveTo(10, -5, 0, -5, 0, 5);
            ctx.fill();
            ctx.restore();
        }

        // Class Hạt (Particle)
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height + height; // Bắt đầu từ dưới màn hình
                // Tỷ lệ trái tim là 30%, còn lại là đốm sáng
                this.isHeart = Math.random() < 0.3; 
                this.size = this.isHeart ? Math.random() * 8 + 8 : Math.random() * 3 + 1;
                this.speedY = Math.random() * -1.5 - 0.5; // Bay lên trên
                this.speedX = Math.random() * 1.5 - 0.75; // Lắc lư nhẹ
                this.opacity = Math.random() * 0.5 + 0.3;
                
                const colors = ['#ffffff', '#ffc1cc', '#ffd700', '#ff9a9e', '#ff4081'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                
                // Dao động ngang
                this.angle = Math.random() * Math.PI * 2;
                this.spin = Math.random() * 0.02 - 0.01;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.angle) * 0.5;
                this.angle += this.spin;

                // Nếu bay khỏi màn hình phía trên thì reset lại ở dưới
                if (this.y < -50) {
                    this.y = height + 50;
                    this.x = Math.random() * width;
                }
            }

            draw() {
                if (this.isHeart) {
                    drawHeart(ctx, this.x, this.y, this.size, this.color, this.opacity);
                } else {
                    ctx.save();
                    ctx.globalAlpha = this.opacity;
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        // Khởi tạo danh sách hạt
        function initParticles() {
            particlesArray.length = 0;
            // Số lượng hạt tùy theo kích thước màn hình
            const numParticles = Math.min(Math.floor(width * height / 10000), 80);
            for (let i = 0; i < numParticles; i++) {
                let p = new Particle();
                // Phân tán rải rác ngay từ đầu để không bị trống màn hình
                p.y = Math.random() * height; 
                particlesArray.push(p);
            }
        }

        // Vòng lặp animation
        function animate() {
            ctx.clearRect(0, 0, width, height);
            particlesArray.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        // Chạy hiệu ứng khi tải xong trang
        window.onload = () => {
            initParticles();
            animate();
        };

    </script>
</body>
</html>
